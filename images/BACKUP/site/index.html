<!DOCTYPE html>
<html lang="pt-br">
<head>
<title>Asernet</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
  html, * {
    margin: 0;
    padding: 0;
  }
  li {
    list-style: none;
  }
  a {
    text-decoration: none;
  }
  body {
    color: #3E3E3E;
    font-family: 'Montserrat', sans-serif;
    font-size: 16px;
  }
  header {
    text-align: center;
    padding: 30px 0;
    width: 100%;
  }

  header h1 {
    margin: 0 auto;
  }

  section {
    border: 1px solid #C4C4C4;
    -webkit-border-top-left-radius: 25px;
    -webkit-border-top-right-radius: 25px;
    -moz-border-radius-topleft: 25px;
    -moz-border-radius-topright: 25px;
    border-top-left-radius: 25px;
    border-top-right-radius: 25px;
    margin: 0 auto;
    padding: 50px 70px 0 70px;
    width: 990px;
  }

  section h2 {
    font-size: 50px;
    text-align: center;
    margin-bottom: 50px;
  }

  section p {
    font-size: 30px;
    margin-bottom: 40px;
    text-align: center;
  }

  section ul {
    text-align: center;
    margin-bottom: -4px;
  }

  section ul li {
    display: inline-block;
    margin: 0 -2px;
  }

  @media (max-width: 1200px){
    header h1 img{
      width: 200px;
    }
    section {
      margin: 0 auto;
      width: 70%;
    }
    section h2 {
      font-size: 30px;
      margin-bottom: 30px;
    }

    section p {
      font-size: 18px;
      margin-bottom: 25px;
    }
    section ul li img{
      width: 150px;
    }
  }

  @media (max-width: 880px){
    header h1 img{
      width: 150px;
    }
    section h2 {
      font-size: 25px;
      margin-bottom: 25px;
    }

    section p {
      font-size: 16px;
      margin-bottom: 20px;
    }
    section ul li:nth-child(1){
      margin-left: 80px;
    }
    section ul li:nth-child(2){
      margin-right: 80px;
    }
  }

  @media (max-width: 657px){
    section {
      padding: 15px 30px;
    }
    section ul li:nth-child(1){
      margin-left: 20px;
    }
    section ul li:nth-child(2){
      margin-right: 20px;
    }
  }

  @media (max-width: 485px){
    section ul li:nth-child(1){
      margin-left: 0px;
    }
    section ul li:nth-child(2){
      margin-right: 0px;
    }
  }
</style>
</head>



<body>

<header>
  <h1>
    <img src="images/LogoAsernet.png" alt="Asernet Telecom" />
  </h1>
</header>

<section>
  <h2>Nosso site está sendo atualizado para trazer mais praticidade à você!</h2>
  <p>Enquanto isso entre em contato conosco por nossos canais de atendimento:</p>

  <ul>
    <li>
      <a href="https://api.whatsapp.com/send?phone=551938955262&text=Olá pode me ajudar?" target="_blank">
        <img src="images/whatsapp.png" alt="Atendimento por Whats App" />
      </a>
    </li>
    <li>
      <a href="https://mk.asernet.com.br/sac/login/?sys=SAC" target="_blank">
        <img src="images/sac.png" alt="Painel do cliente" />
      </a>
    </li>
    <li>
      <a href="https://www.facebook.com/CurtaAsernet/" target="_blank">
        <img src="images/facebook.png" alt="Página do Facebook" />
      </a>
    </li>
    <li>
      <a href="tel:1938955262" target="_blank">
        <img src="images/telefone.png" alt="Atendimento por telefone (19) 3895-5262" />
      </a>
    </li>
  </ul>
</section>


</body>
</html>
